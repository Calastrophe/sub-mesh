name: release

# Push a tag such as v0.1.0 to build the binaries and publish a GitHub Release.
# The tag must match the version in the workspace Cargo.toml. A manual run
# builds everything and keeps the archives as a workflow artifact, but
# publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.100.0

jobs:
  version:
    name: check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: read
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("workspace version must use X.Y.Z")
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("release tag must match the workspace version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PYTHON

  web:
    name: dashboard
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install trunk
        run: |
          curl --proto "=https" --proto-redir "=https" -fsSL -o trunk.tar.gz https://github.com/trunk-rs/trunk/releases/download/v0.22.2/trunk-x86_64-unknown-linux-musl.tar.gz
          echo "4a90216d93c553f3d8b7401fce0dee588e0fb1eb1c6a379ebac81fabe820f25b  trunk.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf trunk.tar.gz -C "$HOME/.local/bin" trunk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      - name: Build the dashboard
        working-directory: crates/mesh-web
        run: trunk build --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: crates/mesh-web/dist
          if-no-files-found: error

  linux:
    name: x86_64 Linux (musl)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export RUSTFLAGS="-C target-feature=+crt-static --remap-path-prefix=$GITHUB_WORKSPACE=."
          cargo build --release --locked --target x86_64-unknown-linux-musl -p mesh-server -p mesh-daemon -p meshctl
      - name: Collect the binaries
        run: |
          mkdir bin
          cp target/x86_64-unknown-linux-musl/release/{mesh-server,mesh-daemon,meshctl} bin/
          for binary in bin/*; do
            info=$(readelf -l -d "$binary")
            if [[ "$info" == *INTERP* || "$info" == *NEEDED* ]]; then
              echo "Expected a static binary: $binary" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-linux
          path: bin
          if-no-files-found: error

  windows:
    name: x86_64 Windows (MSVC)
    needs: version
    runs-on: windows-2022
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install "$env:RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p mesh-daemon -p meshctl
      - name: Collect the binaries
        shell: bash
        run: |
          mkdir bin
          cp target/x86_64-pc-windows-msvc/release/{mesh-daemon,meshctl}.exe bin/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-windows
          path: bin
          if-no-files-found: error

  package:
    name: package
    needs: [version, web, linux, windows]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: built
      - name: Package
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          scripts/package.sh "$VERSION" x86_64-linux built/bin-linux built/bin-windows built/web dist
          scripts/package.sh "$VERSION" x86_64-windows built/bin-windows built/bin-linux built/web dist
          (cd dist && sha256sum "mesh-$VERSION-x86_64-linux.tar.gz" "mesh-$VERSION-x86_64-windows.zip" > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "mesh $VERSION" --generate-notes
