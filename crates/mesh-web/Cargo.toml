[package]
name = "mesh-web"
description = "Leptos (wasm, client-side rendered) dashboard for mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mesh-core.workspace = true
chrono = { workspace = true, features = ["wasmbind"] }
serde.workspace = true
thiserror.workspace = true
leptos = { version = "0.8.23", features = ["csr"] }
gloo-net = { version = "0.8.0", default-features = false, features = ["http", "json"] }
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.107", features = ["Window", "Location", "MediaQueryList", "HtmlInputElement", "ValidityState"] }

[lints]
workspace = true
