[workspace]
resolver = "3"
members = ["crates/*"]
# mesh-web is a wasm frontend built with trunk; keep it out of plain
# `cargo build`/`cargo test`.
default-members = [
    "crates/mesh-core",
    "crates/mesh-providers",
    "crates/mesh-relay",
    "crates/mesh-daemon",
    "crates/mesh-server",
    "crates/meshctl",
]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
mesh-core = { path = "crates/mesh-core" }
mesh-providers = { path = "crates/mesh-providers" }
mesh-relay = { path = "crates/mesh-relay" }

anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures-util = { version = "0.3", features = ["sink"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
webpki-roots = "1"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
